{% extends 'base.html' %}

{% block title %}Create Placement Drive - Company{% endblock %}

{% block content %}
<div class="row pt-4 justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="fw-bold mb-4">Create Placement Drive</h2>
            <form method="POST">
                <div class="mb-3">
                    <label for="job_title" class="form-label">Job Title</label>
                    <input type="text" class="form-control" id="job_title" name="job_title" required placeholder="e.g. Software Engineer Intern">
                </div>
                <div class="mb-3">
                    <label for="job_description" class="form-label">Job Description</label>
                    <textarea class="form-control" id="job_description" name="job_description" rows="5" required placeholder="Describe the roles, responsibilities, and company details..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="eligibility" class="form-label">Eligibility Criteria</label>
                    <textarea class="form-control" id="eligibility" name="eligibility" rows="3" required placeholder="e.g. CGPA > 8.0, No backlogs, CSE/IT students only..."></textarea>
                </div>
                <div class="mb-4">
                    <label for="deadline" class="form-label">Application Deadline</label>
                    <input type="date" class="form-control" id="deadline" name="deadline" required>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{{ url_for('company.dashboard') }}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-5">Publish Drive</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
