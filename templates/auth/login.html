{% extends 'base.html' %}

{% block title %}Login - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="text-center fw-bold mb-4">Login</h2>
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                </div>
            </form>
            <hr class="my-4">
            <div class="text-center text-muted">
                <p class="mb-1">Don't have an account?</p>
                <a href="{{ url_for('auth.register_student') }}" class="text-decoration-none">Register as Student</a> or
                <a href="{{ url_for('auth.register_company') }}" class="text-decoration-none">Register as Company</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
