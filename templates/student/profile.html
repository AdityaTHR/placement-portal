{% extends 'base.html' %}

{% block title %}My Profile - Student{% endblock %}

{% block content %}
<div class="row pt-4 justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <h2 class="fw-bold mb-4">My Profile</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ profile.name }}" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="contact" class="form-label">Contact Number</label>
                        <input type="text" class="form-control" id="contact" name="contact" value="{{ profile.contact }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" class="form-control" id="department" name="department" value="{{ profile.department }}" required>
                    </div>
                </div>
                <div class="mb-3 col-md-4">
                    <label for="cgpa" class="form-label">Current CGPA</label>
                    <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" value="{{ profile.cgpa }}" required>
                </div>
                
                <hr class="my-4">
                
                <div class="mb-4">
                    <label for="resume" class="form-label">Resume (PDF/Doc)</label>
                    <input type="file" class="form-control" id="resume" name="resume">
                    {% if profile.resume_path %}
                        <div class="form-text mt-2 text-success">
                            Current resume: {{ profile.resume_path }}
                        </div>
                    {% else %}
                        <div class="form-text mt-2">No resume uploaded yet.</div>
                    {% endif %}
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
